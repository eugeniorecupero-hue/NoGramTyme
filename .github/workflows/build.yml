name: Build Android APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew || echo "No gradlew found, will create wrapper"

      - name: Create Gradle Wrapper if missing
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.4
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: List build outputs
        if: always()
        run: |
          echo "=== Listing all APK files ==="
          find . -name "*.apk" -type f
          echo "=== Listing app/build directory ==="
          ls -R app/build/ || echo "app/build directory not found"

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NoGramTime-debug
          path: |
            **/*.apk
            app/build/outputs/apk/**/*.apk
