name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          target: android-34
          build-tools: "34.0.0"

      - name: Setup Gradle (wrapperless OK)
        uses: gradle/actions/setup-gradle@v4

      # 🔎 Trova automaticamente la cartella del progetto (quella che contiene settings.gradle*).
      - name: Detect Gradle project dir
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          # cerca settings.gradle(.kts)
          file="$(git ls-files -z | tr '\0' '\n' | grep -E '(^|/)(settings\.gradle(\.kts)?)$' | head -n1 || true)"
          if [ -z "$file" ]; then
            echo "❌ Nessun settings.gradle trovato." >&2
            exit 1
          fi
          dir="$(dirname "$file")"
          if [ "$dir" = "." ]; then dir=""; fi
          echo "PROJECT_DIR=$dir" >> "$GITHUB_ENV"
          echo "Trovato settings in: ${dir:-<repo root>}"

      - name: Build Debug APK
        shell: bash
        run: |
          cd "${PROJECT_DIR:-.}"
          echo "Working dir: $(pwd)"
          gradle :app:assembleDebug

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NoGramTime-debug
          path: |
            ${PROJECT_DIR}/app/build/outputs/apk/debug/app-debug.apk
